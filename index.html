<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7f6ff">
<meta name="description" content="Games, apps, and experiments I'm building with AI.">
<title>Blake's Builds</title>
<style>
  :root {
    --ink: #3a2b58;
    --muted: #6d5888;
    --card: rgba(255, 255, 255, 0.86);
    --line: rgba(255, 255, 255, 0.72);
    --shadow: 0 12px 28px rgba(92, 52, 130, 0.12);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    background:
      radial-gradient(42rem 24rem at -10% -10%, rgba(255, 214, 236, 0.95), transparent 60%),
      radial-gradient(36rem 22rem at 110% 0%, rgba(196, 232, 255, 0.95), transparent 55%),
      radial-gradient(28rem 20rem at 80% 110%, rgba(255, 236, 186, 0.9), transparent 50%),
      linear-gradient(165deg, #e7f6ff 0%, #f7e4ff 46%, #fff6dc 100%);
    padding:
      max(20px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(40px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  .wrap {
    width: min(920px, 100%);
    margin: 0 auto;
  }

  header {
    padding: 18px 6px 4px;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.02;
  }

  .tagline {
    margin: 12px 0 0;
    max-width: 22rem;
    color: var(--muted);
    font-size: 1.15rem;
    line-height: 1.45;
  }

  section { margin-top: 36px; }

  h2 {
    margin: 0 0 14px 6px;
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    gap: 14px;
  }

  a.card,
  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 118px;
    padding: 18px 18px 18px 16px;
    color: inherit;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
  }

  a.card {
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  a.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 32px rgba(92, 52, 130, 0.16);
  }

  a.card:active { transform: scale(0.985); }

  a.card:focus-visible {
    outline: 3px solid #c45ad6;
    outline-offset: 3px;
  }

  .mark {
    flex: none;
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    border-radius: 24px;
    font-size: 2.6rem;
    background: #fff8e8;
  }

  .mark.shapes { background: #e7f2ff; }
  .mark.soon { background: #f4eefe; }

  .card h3 {
    margin: 0 0 4px;
    font-size: 1.45rem;
    letter-spacing: -0.02em;
  }

  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.35;
  }

  .soon {
    background: rgba(255, 255, 255, 0.48);
    border: 2px dashed rgba(90, 58, 130, 0.2);
    box-shadow: none;
  }

  @media (min-width: 720px) {
    body { padding-top: 48px; }
    header { padding-top: 12px; }
    .grid { grid-template-columns: 1fr 1fr; }
    .soon { grid-column: 1 / -1; }
    a.card, .card { min-height: 148px; padding: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    a.card { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Blake's Builds</h1>
      <p class="tagline">Games, apps, and experiments I'm building with AI.</p>
    </header>

    <section aria-labelledby="little-ones">
      <h2 id="little-ones">For little ones</h2>
      <div class="grid">
        <a class="card" href="games/daisy-counts/">
          <span class="mark" aria-hidden="true">🌼</span>
          <span>
            <h3>Daisy Counts</h3>
            <p>Count 1 to 10 with fun objects</p>
          </span>
        </a>
        <a class="card" href="games/shape-friends/">
          <span class="mark shapes" aria-hidden="true">🔷</span>
          <span>
            <h3>Shape Friends</h3>
            <p>Shapes, colors, and letters</p>
          </span>
        </a>
        <div class="card soon">
          <span class="mark soon" aria-hidden="true">✨</span>
          <span>
            <h3>More coming soon</h3>
            <p>New games, apps, and experiments will show up here.</p>
          </span>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
